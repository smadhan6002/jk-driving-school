<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page Not Found | JK Driving School Mannivakkam</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="jk_logo_header.jpg" />
  <style>
    :root {
      --bg-navy-deep: #0F2040;
      --bg-navy: #17325C;
      --accent-blue: #2563D9;
      --accent-whatsapp: #16A34A;
      --text-white: #FFFFFF;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-navy-deep);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .error-container {
      max-width: 580px;
      width: 100%;
      background: rgba(23, 50, 92, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 3rem 2rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    .brand-logo-img {
      width: 65px;
      height: auto;
      margin-bottom: 1.5rem;
    }
    .error-code {
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent-blue);
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--text-white);
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent-blue);
      color: #FFFFFF;
      border: 1px solid transparent;
    }
    .btn-primary:hover {
      background: #1A4FBB;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(37, 99, 217, 0.4);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }
    .footer-credits {
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <img src="jk_logo_header.jpg" alt="JK Driving School Logo" class="brand-logo-img" width="65" height="50" />
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or may have been moved. Return to the homepage to explore driving courses, RTO services, and training batches.</p>
    <div class="action-group">
      <a href="/" class="btn btn-primary">Return to Homepage</a>
      <a href="tel:+919841589252" class="btn btn-secondary">Call 98415 89252</a>
    </div>
    <div class="footer-credits">
      JK Driving School &bull; 183, SH 48, Shanmuga Nagar, Mannivakkam Extension
    </div>
  </div>
</body>
</html>
